# nginx.conf para SPA (Single Page Application)
# Esta configuración asegura que todas las rutas sean servidas por index.html,
# permitiendo que React Router DOM maneje el enrutamiento en el frontend.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sirve archivos estáticos directamente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opcional: cacheo de archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
